name: Сообщение об ошибке
description: Зафиксировать воспроизводимый дефект приложения
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Заполните данные так, чтобы команда могла воспроизвести ошибку.
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Кратко опишите проблему и её влияние на пользователя.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. Увидеть ошибку ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Критичность
      options:
        - Блокирующая
        - Высокая
        - Средняя
        - Низкая
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: production, Windows 11, Chrome 130
  - type: textarea
    id: evidence
    attributes:
      label: Логи и снимки экрана
      description: Не добавляйте пароли, токены и персональные данные.

